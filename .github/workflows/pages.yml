# Builds the calendar from the live SOCS feed and publishes it to GitHub Pages.
# Runs on every push to main and on demand (workflow_dispatch). An outside scheduler
# triggers it every 30 minutes to pick up calendar changes; the daily schedule below is
# a backup in case that stops. If the feed can't be fetched the build fails and the
# previously published site stays up.
name: Build and deploy calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
