<!doctype html>
<!-- Served by GitHub Pages for any address the site doesn't have. The build fills in
     {{BASE}} (the site's path, e.g. "/") and {{V}} (the asset version). -->
<html lang="en-GB" data-base="{{BASE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'self'">
  <title>Page not found | Mayfield School Calendar</title>
  <link rel="icon" href="{{BASE}}favicon.svg" type="image/svg+xml">
  <!-- Sends old SOCS calendar links to the new calendar before the page is shown. -->
  <script src="{{BASE}}redirect.js?v={{V}}"></script>
  <link rel="stylesheet" href="{{BASE}}fonts.css?v={{V}}">
  <link rel="stylesheet" href="{{BASE}}styles.css?v={{V}}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="https://www.mayfieldgirls.org/" aria-label="Mayfield School home">
        <img src="{{BASE}}logo.svg" alt="Mayfield" width="183" height="48">
      </a>
    </div>
  </header>
  <main class="wrap not-found">
    <h1>Page not found</h1>
    <p>The school calendar has a new look, so some old links no longer work.</p>
    <p><a class="btn btn-primary" href="{{BASE}}">Go to the school calendar</a></p>
  </main>
</body>
</html>
